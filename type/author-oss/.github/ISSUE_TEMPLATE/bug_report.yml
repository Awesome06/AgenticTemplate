name: Bug Report
description: File an actionable bug report with reproduction steps
title: "fix(scope): "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for filing a bug report! Please provide detailed information to help us reproduce the issue.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal commands, code snippets, or reproduction script.
      placeholder: |
        1. Run command '...'
        2. Execute function '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, compiler / interpreter runtime, package version.
      placeholder: |
        - OS: Windows 11 / Ubuntu 22.04 / macOS 14
        - Runtime: Python 3.12 / Go 1.22 / Rust 1.80
    validations:
      required: true

